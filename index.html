        // Safe Storage Helper
        function getSafeStorage(key, fallback) {
            try {
                const local = localStorage.getItem(key);
                if (!local) return fallback;
                const parsed = JSON.parse(local);
                return parsed || fallback;
            } catch (e) {
                console.warn("SafeStorage read error for " + key + ":", e);
                return fallback;
            }
        }

        function setSafeStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            } catch (e) {
                console.warn("SafeStorage write error for " + key + ":", e);
            }
        }

        function exportToPDF(elementId, fileName) {
            const element = document.getElementById(elementId);
            if (!element) {
                console.warn("Elemento no encontrado para PDF");
                return;
            }
            if (window.html2pdf) {
                const opt = {
                    margin:       [8, 8, 8, 8],
                    filename:     fileName,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, logging: false, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                window.html2pdf().set(opt).from(element).save();
            } else {
                window.print();
            }
        }

            const [selectedDate, setSelectedDate] = useState(TODAY_STR);

            const [selectedYear, setSelectedYear] = useState(TODAY_STR.substring(0, 4));
            
            const [selectedProfFilter, setSelectedProfFilter] = useState(isProfesional ? currentUser.id : 'ALL');

            useEffect(() => {
                if (isProfesional) {

                }

            const timeSlots = [
                '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', 
                '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'
            ];

            const filteredApts = (appointments || []).filter(a => {
                if (!a) return false;
                
                let matchPeriod = false;
                if (viewMode === 'DAY') {
                    matchPeriod = a.date === selectedDate;
                } else if (viewMode === 'MONTH') {
                    matchPeriod = a.date && a.date.startsWith(selectedMonth);
                } else if (viewMode === 'YEAR') {
                    matchPeriod = a.date && a.date.startsWith(selectedYear);
                }

                if (!matchPeriod) return false;

                const targetProf = isProfesional ? currentUser.id : selectedProfFilter;
                if (targetProf === 'ALL') return true;
                return (a.services || []).some(s => s.professionalId === targetProf);

                                                            onClick={() => onOpenAppointment(apt)}
                                                            className="p-2.5 bg-gradient-to-r from-divas-50 to-white border border-divas-200 hover:border-divas-500 rounded-xl cursor-pointer shadow-sm text-xs flex items-center space-x-3 transition-all">
                                                            <div className="w-2 h-8 bg-divas-500 rounded-full"></div>
                                                            <div>
                                                                <p className="font-bold text-divas-900">{apt.clientName} <span className="text-[10px] text-gray-500">({apt.startTime} - {apt.endTime})</span></p>
                                                                <div className="flex flex-wrap gap-1 mt-0.5">
                                                                    {(apt.services || []).map((s, idx) => (
                                                                        <span key={idx} className="text-[9px] bg-white border border-divas-200 px-1.5 py-0.5 rounded text-divas-800 font-semibold">
                                                                            {s.serviceName} ({s.professionalName})
                                                                        </span>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                            <span className="font-extrabold text-divas-900 ml-auto">${(apt.finalTotal || 0).toLocaleString('es-CL')}</span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {(viewMode === 'MONTH' || viewMode === 'YEAR') && (
                        <div className="space-y-4">
                            <div className="p-4 bg-divas-900 text-white rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div>
                                    <h4 className="font-bold text-sm">Resumen Período {viewMode === 'MONTH' ? selectedMonth : selectedYear}</h4>
                                    <p className="text-xs text-divas-200">Citas encontradas en el sistema: <span className="font-bold text-white">{filteredApts.length}</span></p>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] text-divas-300 block uppercase font-bold">Total Recaudado</span>
                                    <span className="text-2xl font-black text-divas-400">
                                        ${filteredApts.reduce((sum, a) => sum + (Number(a.finalTotal) || 0), 0).toLocaleString('es-CL')}
                                    </span>
                                </div>
                            </div>

                            <div className="overflow-x-auto border border-gray-200 rounded-2xl shadow-sm">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-divas-900 text-white uppercase text-[10px]">
                                        <tr>
                                            <th className="p-3">Fecha</th>
                                            <th className="p-3">Hora</th>
                                            <th className="p-3">Clienta</th>
                                            <th className="p-3">Servicios Agendados</th>
                                            <th className="p-3">Total ($)</th>
                                            <th className="p-3">Estado</th>
                                            <th className="p-3 text-right">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 bg-white">
                                        {filteredApts.map(apt => (
                                            <tr key={apt.id} className="hover:bg-divas-50/30">
                                                <td className="p-3 font-bold text-divas-900">{apt.date}</td>
                                                <td className="p-3 text-gray-600">{apt.startTime}</td>
                                                <td className="p-3 font-bold text-gray-800">{apt.clientName}</td>
                                                <td className="p-3">
                                                    {(apt.services || []).map((s, i) => (
                                                        <span key={i} className="inline-block bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-[10px] mr-1 mb-1 font-semibold">
                                                            {s.serviceName} ({s.professionalName})
                                                        </span>
                                                    ))}
                                                </td>
                                                <td className="p-3 font-extrabold text-divas-900 text-sm">${(apt.finalTotal || 0).toLocaleString('es-CL')}</td>
                                                <td className="p-3">
                                                    <span className="px-2 py-0.5 rounded-full font-bold text-[10px] bg-emerald-100 text-emerald-800">{apt.status}</span>
                                                </td>
                                                <td className="p-3 text-right">
                                                    <button onClick={() => onOpenAppointment(apt)} className="px-3 py-1 bg-divas-600 text-white font-bold text-[10px] rounded-lg">
                                                        Ver / Editar
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AppointmentCartModal({ isOpen, onClose, appointment, clients, catalog, users, appointments, currentUser, notify, onSaveAppointment }) {
            const isEditing = !!appointment && !!appointment.id;

            const [selectedClientId, setSelectedClientId] = useState(appointment?.clientId || (clients[0]?.id || ''));
            const [date, setDate] = useState(appointment?.date || TODAY_STR);
            const [startTime, setStartTime] = useState(appointment?.startTime || '10:00');
            const [cartServices, setCartServices] = useState(appointment?.services || []);
            
            const [discountType, setDiscountType] = useState(appointment?.discountType || 'NONE');
            const [discountValue, setDiscountValue] = useState(appointment?.discountValue || 0);
            const [hasCustomPrice, setHasCustomPrice] = useState(appointment?.hasCustomPrice || false);
            const [customFinalPrice, setCustomFinalPrice] = useState(appointment?.customFinalPrice || '');
            
            const [status, setStatus] = useState(appointment?.status || 'CONFIRMED');
            const [paymentStatus, setPaymentStatus] = useState(appointment?.paymentStatus || 'PENDING');
            const [paymentMethod, setPaymentMethod] = useState(appointment?.paymentMethod || 'EFECTIVO');
            const [notes, setNotes] = useState(appointment?.notes || '');

            const [addServiceId, setAddServiceId] = useState(catalog[0]?.id || '');
            const [addVariantId, setAddVariantId] = useState(catalog[0]?.variants?.[0]?.id || 'v1');
            const [addProfId, setAddProfId] = useState((users.find(u => u.role === 'PROFESIONAL') || users[0])?.id || '');

            const totalDuration = useMemo(() => {
                return (cartServices || []).reduce((sum, s) => sum + (Number(s.duration) || 0), 0);
            }, [cartServices]);

            const endTime = useMemo(() => {
                if (!startTime) return '11:00';
                const [h, m] = startTime.split(':').map(Number);
                const totalMinutes = h * 60 + m + totalDuration;
                const endH = Math.floor(totalMinutes / 60) % 24;
                const endM = totalMinutes % 60;
                return String(endH).padStart(2, '0') + ":" + String(endM).padStart(2, '0');
            }, [startTime, totalDuration]);

            const subtotal = useMemo(() => {
                return (cartServices || []).reduce((sum, s) => sum + (Number(s.appliedPrice) || 0), 0);
            }, [cartServices]);

            const calculatedTotal = useMemo(() => {
                let total = subtotal;
                if (discountType === 'FIXED') {
                    total = Math.max(0, subtotal - Number(discountValue));
                } else if (discountType === 'PERCENTAGE') {
                    total = Math.max(0, subtotal - (subtotal * (Number(discountValue) / 100)));
                }
                return Math.round(total);
            }, [subtotal, discountType, discountValue]);

            const finalTotal = hasCustomPrice ? (Number(customFinalPrice) || 0) : calculatedTotal;

            const handleAddServiceToCart = () => {
                const catalogItem = (catalog || []).find(c => c.id === addServiceId);
                if (!catalogItem) return;

                const variant = (catalogItem.variants || []).find(v => v.id === addVariantId) || catalogItem.variants?.[0] || { name: 'Estándar', price: catalogItem.price, duration: catalogItem.duration };
                const prof = (users || []).find(u => u.id === addProfId) || users[0];

                const newItem = {
                    serviceId: catalogItem.id,
                    serviceName: catalogItem.name,
                    variantId: variant.id,
                    variantName: variant.name,
                    catalogPrice: variant.price,
                    appliedPrice: variant.price,
                    duration: variant.duration,
                    professionalId: prof.id,
                    professionalName: prof.name
                };

                setCartServices(prev => [...prev, newItem]);
            };

            const handleRemoveService = (index) => {
                setCartServices(prev => prev.filter((_, i) => i !== index));
            };

            const handleUpdateServiceField = (index, field, value) => {
                setCartServices(prev => {
                    const copy = [...prev];
                    copy[index] = { ...copy[index], [field]: value };
                    return copy;
                });
            };

            const handleSave = (e) => {
                e.preventDefault();
                const clientObj = (clients || []).find(c => c.id === selectedClientId);

                if (!clientObj) {
                    notify('Selecciona una clienta válida', 'error');
                    return;
                }
                if ((cartServices || []).length === 0) {
                    notify('El carrito debe tener al menos un servicio', 'error');
                    return;
                }

                const savedApt = {
                    id: appointment?.id || "apt-" + Date.now(),
                    clientId: clientObj.id,
                    clientName: clientObj.firstName + " " + clientObj.lastName,
                    clientPhone: clientObj.phone,
                    date,
                    startTime,
                    endTime,
                    services: cartServices,
                    subtotal,
                    discountType,
                    discountValue: Number(discountValue),
                    calculatedTotal,
                    hasCustomPrice,
                    customFinalPrice: hasCustomPrice ? Number(customFinalPrice) : null,
                    finalTotal,
                    paymentStatus,
                    paymentMethod,
                    status,
                    notes,
                    createdAt: appointment?.createdAt || TODAY_STR,
                    updatedAt: TODAY_STR,
                    createdBy: appointment?.createdBy || currentUser?.id,
                    updatedBy: currentUser?.id
                };

                onSaveAppointment(savedApt);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
                    <div className="bg-white rounded-3xl w-full max-w-3xl max-h-[92vh] overflow-y-auto shadow-2xl border border-gray-100 flex flex-col">
                        
                        <div className="p-5 bg-divas-900 text-white flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 bg-divas-600 rounded-xl flex items-center justify-center">
                                    <i className="fa-solid fa-cart-shopping text-white text-lg"></i>
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold font-serif-title">
                                        {isEditing ? "Editar Cita #" + appointment.id : 'Nueva Cita Multiservicio (Carrito)'}
                                    </h3>
                                    <p className="text-xs text-divas-300">Reserva múltiple y personalización financiera</p>
                                </div>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSave} className="p-6 space-y-6 flex-1 text-xs">
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Clienta</label>
                                    <select 
                                        value={selectedClientId} 
                                        onChange={e => setSelectedClientId(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500">
                                        {(clients || []).map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.firstName} {c.lastName} ({c.rut})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Fecha de Reserva</label>
                                    <input 
                                        type="date" 
                                        value={date} 
                                        onChange={e => setDate(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Hora Inicio</label>
                                    <input 
                                        type="time" 
                                        value={startTime} 
                                        onChange={e => setStartTime(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500"
                                    />
                                </div>
                            </div>

                            <div className="border border-divas-200 rounded-2xl p-4 bg-divas-50/40 space-y-3">
                                <h4 className="text-xs font-bold uppercase tracking-wider text-divas-800 flex items-center space-x-2">
                                    <i className="fa-solid fa-plus-circle text-divas-600"></i>
                                    <span>Agregar Servicio al Carrito</span>
                                </h4>

                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                    <div className="sm:col-span-1">
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Servicio</label>
                                        <select 
                                            value={addServiceId}
                                            onChange={e => {
                                                setAddServiceId(e.target.value);
                                                const found = (catalog || []).find(c => c.id === e.target.value);
                                                if (found && found.variants?.length) setAddVariantId(found.variants[0].id);
                                            }}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(catalog || []).map(c => (
                                                <option key={c.id} value={c.id}>{c.name} (${c.price.toLocaleString('es-CL')})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Variante</label>
                                        <select 
                                            value={addVariantId}
                                            onChange={e => setAddVariantId(e.target.value)}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(catalog || []).find(c => c.id === addServiceId)?.variants?.map(v => (
                                                <option key={v.id} value={v.id}>{v.name} (${v.price.toLocaleString('es-CL')})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Profesional</label>
                                        <select 
                                            value={addProfId}
                                            onChange={e => setAddProfId(e.target.value)}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(users || []).filter(u => u.role === 'PROFESIONAL' || u.role === 'ADMIN').map(u => (
                                                <option key={u.id} value={u.id}>{u.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex items-end">
                                        <button 
                                            type="button"
                                            onClick={handleAddServiceToCart}
                                            className="w-full py-2 bg-divas-600 hover:bg-divas-700 text-white rounded-xl text-xs font-bold shadow-md shadow-divas-600/20">
                                            + AGREGAR
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h4 className="text-xs font-bold uppercase tracking-wider text-gray-600 mb-2 flex items-center justify-between">
                                    <span>Servicios Agregados ({(cartServices || []).length})</span>
                                    <span className="text-divas-600 font-extrabold">Duración Estimada: {totalDuration} min ({startTime} ➔ {endTime})</span>
                                </h4>

                                {!cartServices || cartServices.length === 0 ? (
                                    <div className="p-8 text-center text-gray-400 border border-dashed border-gray-200 rounded-2xl text-xs">
                                        El carrito está vacío. Agrega al menos un servicio arriba.
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {cartServices.map((s, idx) => (
                                            <div key={idx} className="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <h5 className="font-bold text-xs text-divas-900">{s.serviceName}</h5>
                                                        <span className="text-[10px] text-gray-500 font-medium">Variante: {s.variantName} | Catálogo: ${(s.catalogPrice || 0).toLocaleString('es-CL')}</span>
                                                    </div>
                                                    <button 
                                                        type="button" 
                                                        onClick={() => handleRemoveService(idx)}
                                                        className="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 rounded-lg hover:bg-red-50">
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-gray-100">
                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Profesional</label>
                                                        <select 
                                                            value={s.professionalId}
                                                            onChange={e => {
                                                                const p = (users || []).find(u => u.id === e.target.value);
                                                                if (p) {
                                                                    handleUpdateServiceField(idx, 'professionalId', p.id);
                                                                    handleUpdateServiceField(idx, 'professionalName', p.name);
                                                                }
                                                            }}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-semibold">
                                                            {(users || []).filter(u => u.role === 'PROFESIONAL' || u.role === 'ADMIN').map(u => (
                                                                <option key={u.id} value={u.id}>{u.name}</option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Precio Aplicado ($)</label>
                                                        <input 
                                                            type="number" 
                                                            value={s.appliedPrice}
                                                            onChange={e => handleUpdateServiceField(idx, 'appliedPrice', Number(e.target.value))}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold text-divas-900"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Duración (min)</label>
                                                        <input 
                                                            type="number" 
                                                            value={s.duration}
                                                            onChange={e => handleUpdateServiceField(idx, 'duration', Number(e.target.value))}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-semibold"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="bg-divas-900 text-white p-5 rounded-2xl space-y-4">
                                <h4 className="text-xs font-bold uppercase tracking-wider text-divas-300">Resumen Financiero & Descuentos</h4>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                                    <div>
                                        <label className="block text-divas-300 mb-1 font-semibold">Tipo Descuento</label>
                                        <select 
                                            value={discountType} 
                                            onChange={e => setDiscountType(e.target.value)}
                                            className="w-full bg-divas-800 border border-divas-700 text-white p-2 rounded-xl">
                                            <option value="NONE">Sin Descuento</option>
                                            <option value="FIXED">Monto Fijo ($)</option>
                                            <option value="PERCENTAGE">Porcentaje (%)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-divas-300 mb-1 font-semibold">Valor Descuento</label>
                                        <input 
                                            type="number" 
                                            value={discountValue} 
                                            onChange={e => setDiscountValue(e.target.value)}
                                            className="w-full bg-divas-800 border border-divas-700 text-white p-2 rounded-xl font-bold"
                                        />
                                    </div>

                                    <div className="col-span-2 flex items-center space-x-3 bg-divas-800/80 p-3 rounded-xl">
                                        <input 
                                            type="checkbox" 
                                            id="customPriceCheck"
                                            checked={hasCustomPrice}
                                            onChange={e => setHasCustomPrice(e.target.checked)}
                                            className="w-4 h-4 rounded text-divas-500 focus:ring-divas-400"
                                        />
                                        <div className="flex-1">
                                            <label htmlFor="customPriceCheck" className="font-bold text-divas-200 cursor-pointer block">
                                                Precio Final Personalizado Manual
                                            </label>
                                            {hasCustomPrice && (
                                                <input 
                                                    type="number" 
                                                    value={customFinalPrice}
                                                    onChange={e => setCustomFinalPrice(e.target.value)}
                                                    placeholder="Ingrese total manual ($)"
                                                    className="w-full mt-2 bg-white text-divas-900 font-extrabold p-2 rounded-lg text-sm"
                                                />
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="border-t border-divas-800 pt-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                    <div className="text-xs space-y-1 text-divas-200">
                                        <p>Subtotal Servicios: <span className="font-bold text-white">${subtotal.toLocaleString('es-CL')}</span></p>
                                        <p>Total Calculado: <span className="font-bold text-white">${calculatedTotal.toLocaleString('es-CL')}</span></p>
                                    </div>

                                    <div className="text-right">
                                        <span className="text-[10px] uppercase font-bold text-divas-300 block">TOTAL FINAL A COBRAR</span>
                                        <span className="text-3xl font-extrabold text-divas-400 tracking-tight">${finalTotal.toLocaleString('es-CL')}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Estado Cita</label>
                                    <select 
                                        value={status} 
                                        onChange={e => setStatus(e.target.value)}
                                        className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold text-gray-800">
                                        <option value="CONFIRMED">🟢 CONFIRMADA</option>
                                        <option value="COMPLETED">🔵 ATENDIDA / COMPLETADA</option>
                                        <option value="CANCELED">🔴 CANCELADA</option>
                                        <option value="NO_SHOW">⚪ NO ASISTIÓ</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Estado Pago</label>
                                    <select 
                                        value={paymentStatus} 
                                        onChange={e => setPaymentStatus(e.target.value)}
                                        className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold text-gray-800">
                                        <option value="PENDING">⏳ PENDIENTE DE PAGO</option>
                                        <option value="PAID">✅ PAGADO COMPLETADO</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Método de Pago</label>
                                    <select 
                                        value={paymentMethod} 
                                        onChange={e => setPaymentMethod(e.target.value)}
                                        className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-800">
                                        <option value="EFECTIVO">Efectivo</option>

        function ReportsView({ appointments, catalog, users }) {
            const [reportPreset, setReportPreset] = useState('MONTH'); // 'TODAY' | 'WEEK' | 'MONTH' | 'YEAR' | 'ALL'
            const [selectedProfReport, setSelectedProfReport] = useState('ALL');

            const filteredApts = useMemo(() => {
                if (reportPreset === 'TODAY') {
                    return (appointments || []).filter(a => a.date === TODAY_STR);
                } else if (reportPreset === 'WEEK') {
                    return (appointments || []).filter(a => a.date && a.date >= '2026-08-25');
                } else if (reportPreset === 'MONTH') {
                    const currentMonth = TODAY_STR.substring(0, 7);
                    return (appointments || []).filter(a => a.date && a.date.startsWith(currentMonth));
                } else if (reportPreset === 'YEAR') {
                    return (appointments || []).filter(a => a.date && a.date.startsWith('2026'));
                }
                return appointments || [];
            }, [appointments, reportPreset]);

            // Totales Financieros
            const totalIngresos = filteredApts.reduce((s, a) => s + (Number(a.finalTotal) || 0), 0);
            const totalBrutoServicios = filteredApts.reduce((s, a) => s + (Number(a.subtotal) || 0), 0);
            const totalDescuentosOtorgados = filteredApts.reduce((s, a) => {
                let desc = 0;
                if (a.discountType === 'FIXED') desc = Number(a.discountValue) || 0;
                else if (a.discountType === 'PERCENTAGE') desc = (Number(a.subtotal) * (Number(a.discountValue)/100)) || 0;
                return s + desc;
            }, 0);

            const totalCitas = filteredApts.length;
            const ticketPromedio = totalCitas > 0 ? Math.round(totalIngresos / totalCitas) : 0;

            // CUADRE DE CAJA POR MÉTODO DE PAGO
            const cashRegisterBreakdown = useMemo(() => {
                const methods = [
                    { id: 'EFECTIVO', name: 'Efectivo en Caja', icon: 'fa-money-bill-wave', color: 'emerald' },
                    { id: 'DEBIT', name: 'Tarjeta Débito BCH', icon: 'fa-credit-card', color: 'blue' },
                    { id: 'CREDIT', name: 'Tarjeta Crédito BCH', icon: 'fa-regular fa-credit-card', color: 'indigo' },
                    { id: 'DEBITMP', name: 'Débito Mercado Pago', icon: 'fa-mobile-screen-button', color: 'cyan' },
                    { id: 'CREDITMP', name: 'Crédito Mercado Pago', icon: 'fa-qrcode', color: 'purple' },
                    { id: 'CANJE SESIONES', name: 'Canje de Sesiones / Packs', icon: 'fa-ticket', color: 'amber' },
                    { id: 'GIFTCARD', name: 'Giftcard / Cupón', icon: 'fa-gift', color: 'pink' },
                    { id: 'TRANSFER', name: 'Transferencia Bancaria', icon: 'fa-building-columns', color: 'violet' }
                ];

                const result = methods.map(m => {
                    const aptsMethod = filteredApts.filter(a => (a.paymentMethod || 'EFECTIVO') === m.id);
                    const paidAmount = aptsMethod.filter(a => a.paymentStatus === 'PAID').reduce((s, a) => s + (Number(a.finalTotal) || 0), 0);
                    const pendingAmount = aptsMethod.filter(a => a.paymentStatus === 'PENDING').reduce((s, a) => s + (Number(a.finalTotal) || 0), 0);
                    return {
                        ...m,
                        totalPaid: paidAmount,
                        totalPending: pendingAmount,
                        count: aptsMethod.length
                    };
                });

                return result;
            }, [filteredApts]);

            const totalPagadoCaja = cashRegisterBreakdown.reduce((s, m) => s + m.totalPaid, 0);
            const totalPendienteCaja = cashRegisterBreakdown.reduce((s, m) => s + m.totalPending, 0);

            // DETALLE EXHAUSTIVO POR CADA PROFESIONAL
            const detailedProfessionalReports = useMemo(() => {
                const map = {};
                (users || []).forEach(u => {
                    map[u.id] = {
                        id: u.id,
                        name: u.name,
                        role: u.role,
                        specialty: u.specialty,
                        photo: u.photo,
                        totalEarned: 0,
                        servicesList: []
                    };
                });

                filteredApts.forEach(apt => {
                    (apt.services || []).forEach(s => {
                        const profId = s.professionalId;
                        if (!map[profId]) {
                            map[profId] = {
                                id: profId,
                                name: s.professionalName || 'Profesional Estándar',
                                role: 'PROFESIONAL',
                                specialty: 'Servicios Varios',
                                photo: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80',
                                totalEarned: 0,
                                servicesList: []
                            };
                        }

                        const priceApplied = Number(s.appliedPrice) || 0;
                        map[profId].totalEarned += priceApplied;
                        map[profId].servicesList.push({
                            aptId: apt.id,
                            date: apt.date,
                            startTime: apt.startTime,
                            clientName: apt.clientName,
                            clientPhone: apt.clientPhone,
                            serviceName: s.serviceName,
                            variantName: s.variantName,
                            catalogPrice: s.catalogPrice,
                            appliedPrice: priceApplied,
                            paymentStatus: apt.paymentStatus,
                            paymentMethod: apt.paymentMethod || 'EFECTIVO',
                            status: apt.status
                        });
                    });
                });

                return Object.values(map).sort((a, b) => b.totalEarned - a.totalEarned);
            }, [filteredApts, users]);

            // PRODUCCIÓN POR CATEGORÍA DE SERVICIO
            const breakdownByCategory = useMemo(() => {
                const stats = {};
                filteredApts.forEach(apt => {
                    (apt.services || []).forEach(s => {
                        const catItem = (catalog || []).find(c => c.id === s.serviceId);
                        const categoryName = catItem ? catItem.category : '💅 OTROS SERVICIOS';

                        if (!stats[categoryName]) {
                            stats[categoryName] = { category: categoryName, total: 0, count: 0 };
                        }
                        stats[categoryName].total += Number(s.appliedPrice) || 0;
                        stats[categoryName].count += 1;
                    });
                });
                return Object.values(stats).sort((a, b) => b.total - a.total);
            }, [filteredApts, catalog]);

            return (
                <div id="reports-pdf-content" className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-8">

                    <div className="pb-4 border-b flex flex-col md:flex-row md:items-center justify-between gap-4">

                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                            <div className="flex items-center bg-gray-100 p-1 rounded-xl text-xs font-bold">
                                <button onClick={() => setReportPreset('TODAY')} className={"px-3 py-1.5 rounded-lg " + (reportPreset === 'TODAY' ? 'bg-divas-600 text-white' : 'text-gray-600')}>Hoy</button>
                                <button onClick={() => setReportPreset('WEEK')} className={"px-3 py-1.5 rounded-lg " + (reportPreset === 'WEEK' ? 'bg-divas-600 text-white' : 'text-gray-600')}>Esta Semana</button>
                                <button onClick={() => setReportPreset('MONTH')} className={"px-3 py-1.5 rounded-lg " + (reportPreset === 'MONTH' ? 'bg-divas-600 text-white' : 'text-gray-600')}>Este Mes</button>
                                <button onClick={() => setReportPreset('YEAR')} className={"px-3 py-1.5 rounded-lg " + (reportPreset === 'YEAR' ? 'bg-divas-600 text-white' : 'text-gray-600')}>Año 2026</button>
                                <button onClick={() => setReportPreset('ALL')} className={"px-3 py-1.5 rounded-lg " + (reportPreset === 'ALL' ? 'bg-divas-600 text-white' : 'text-gray-600')}>Histórico</button>
                            </div>

                            <button 
                                onClick={() => exportToPDF('reports-pdf-content', "Cuadre_Caja_DIVAS_" + TODAY_STR + ".pdf")}
                                className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow-md shadow-red-600/20 flex items-center space-x-2">
                                <i className="fa-solid fa-file-pdf"></i>
                                <span>Exportar Reporte PDF</span>
                            </button>
                        </div>
                    </div>

                    {/* KPI FINANCIAL CARDS */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="p-5 bg-divas-50 rounded-2xl border border-divas-200">
                            <span className="text-xs uppercase font-bold text-divas-700">Facturación Total Recaudada</span>
                            <h3 className="text-3xl font-black text-divas-900 mt-2">${totalIngresos.toLocaleString('es-CL')}</h3>
                            <p className="text-[10px] text-divas-600 mt-1">Bruto: ${totalBrutoServicios.toLocaleString('es-CL')} | Desc: -${totalDescuentosOtorgados.toLocaleString('es-CL')}</p>

        function ProfessionalEarningsView({ currentUser, appointments }) {
            const [fromDate, setFromDate] = useState('2026-08-01');
            const [toDate, setToDate] = useState(TODAY_STR);

            const matchingServices = useMemo(() => {
                const result = [];
                (appointments || []).forEach(apt => {
                    if (!apt || !apt.date) return;
                    if (apt.date >= fromDate && apt.date <= toDate) {
                        (apt.services || []).forEach(srv => {
                            if (srv.professionalId === currentUser?.id) {
                                result.push({
                                    aptId: apt.id,
                                    date: apt.date,
                                    startTime: apt.startTime,
                                    clientName: apt.clientName,
                                    serviceName: srv.serviceName,
                                    variantName: srv.variantName,
                                    appliedPrice: Number(srv.appliedPrice) || 0,
                                    duration: srv.duration,
                                    status: apt.status,
                                    paymentStatus: apt.paymentStatus
                                });
                            }
                        });
                    }
                });
                return result.sort((a, b) => b.date.localeCompare(a.date) || b.startTime.localeCompare(a.startTime));
            }, [appointments, currentUser, fromDate, toDate]);

            const totalEarnedInPeriod = useMemo(() => {
                return matchingServices.reduce((sum, item) => sum + item.appliedPrice, 0);
            }, [matchingServices]);

            return (
                <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-6">

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("SPA Divas Error:", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-divas-900 text-white p-6">
                            <div className="bg-white text-gray-800 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center space-y-4 border border-divas-300">
                                <i className="fa-solid fa-triangle-exclamation text-4xl text-red-500"></i>
                                <h2 className="text-xl font-bold font-serif-title text-divas-900">Se produjo un error de ejecución</h2>
                                <p className="text-xs text-gray-500 font-mono bg-gray-50 p-3 rounded-xl border border-gray-200 overflow-x-auto text-left">
                                    {this.state.error?.toString()}
                                </p>
                                <button 
                                    onClick={() => {
                                        try { localStorage.clear(); } catch(e){}
                                        window.location.reload();
                                    }}
                                    className="w-full py-3 bg-divas-600 hover:bg-divas-700 text-white font-bold text-xs rounded-xl shadow-lg">
                                    Restablecer Estado Local y Recargar
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
