                                        <div>
                                            <label className="font-bold text-slate-700 block mb-1">Medio de Pago:</label>
                                            <select value={editReservationForm.paymentMethod} onChange={(e) => setEditReservationForm({ ...editReservationForm, paymentMethod: e.target.value })} className="w-full p-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#D4AF37] outline-none">
                                                {PAYMENT_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bold text-slate-700 block mb-1">Estado Cita:</label>
                                            <select value={editReservationForm.status} onChange={(e) => setEditReservationForm({ ...editReservationForm, status: e.target.value })} className="w-full p-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-[#D4AF37] outline-none font-bold">
                                                <option value="confirmada">🟢 CONFIRMADA</option>
                                                <option value="por_confirmar">🟡 POR CONFIRMAR</option>
                                                <option value="atendida">🔵 ATENDIDA</option>
                                                <option value="cancelada">🔴 CANCELADA</option>
                                                <option value="no_asistio">❌ NO ASISTIÓ</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-2 pt-3 border-t border-slate-100">
                                    <button onClick={() => setIsEditReservationModalOpen(false)} className="flex-1 py-2.5 bg-slate-100 font-bold text-xs text-slate-700 rounded-xl hover:bg-slate-200">Cancelar</button>
                                    <button onClick={handleSaveReservationEdits} className="flex-1 py-2.5 bg-gradient-to-r from-[#D4AF37] to-[#B38F2D] text-white font-bold text-xs rounded-xl shadow-md hover:opacity-95">Guardar Cambios Cita</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {isClearDemoModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl border border-rose-200 max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
                                <span className="text-3xl block">⚠️</span>
                                <h3 className="font-bold font-serif text-slate-900 text-base">¿Restaurar Datos Demo?</h3>
                                <p className="text-xs text-slate-500">Se eliminarán los registros guardados en tu navegador y se restaurarán los valores por defecto.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setIsClearDemoModalOpen(false)} className="flex-1 py-2.5 bg-slate-100 font-bold text-xs rounded-xl">Cancelar</button>
                                    <button onClick={handleClearDemoData} className="flex-1 py-2.5 bg-rose-600 text-white font-bold text-xs rounded-xl">Sí, Restaurar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 p-4 rounded-2xl bg-[#212121] text-white text-xs font-bold shadow-2xl border border-amber-300 flex items-center space-x-2 animate-bounce">
                            <span>✨ {toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
