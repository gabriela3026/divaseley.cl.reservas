    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'divas-eley-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        window.DIVAS_FIREBASE = {
            isReady: false,
            saveData: null,
            subscribeData: null
        };

        if (firebaseConfig) {
            try {
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                const initAuth = async () => {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                };

                initAuth().then(() => {
                    window.DIVAS_FIREBASE.isReady = true;
                    window.DIVAS_FIREBASE.saveData = async (key, data) => {
                        if (!auth.currentUser) return;
                        try {
                            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'divas_store', 'records', key);
                            await setDoc(docRef, { payload: JSON.stringify(data), updatedAt: new Date().toISOString() });
                        } catch(e) {
                            console.warn("Firestore Save Warning:", e);
                        }
                    };

                    window.DIVAS_FIREBASE.subscribeData = (key, callback) => {
                        if (!auth.currentUser) return () => {};
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'divas_store', 'records', key);
                        return onSnapshot(docRef, (snap) => {
                            if (snap.exists()) {
                                try {
                                    const val = JSON.parse(snap.data().payload);
                                    if (val) callback(val);
                                } catch(e) { console.error(e); }
                            }
                        }, (err) => console.warn("Firestore Snapshot Warning:", err));
                    };
                }).catch(err => console.warn("Firebase Auth Warning:", err));
            } catch(e) {
                console.warn("Firebase Init Warning:", e);
            }
        }
    </script>

                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Emulsión Epicutánea:</label>
                                                    <input type="text" value={facialForm.emulsion || ''} onChange={(e) => setFacialForm({ ...facialForm, emulsion: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="Epicutánea alipídica, Eudérmica..." />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">pH Cutáneo Estimado:</label>
                                                    <input type="text" value={facialForm.phCutaneo || ''} onChange={(e) => setFacialForm({ ...facialForm, phCutaneo: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="5.5 (Equilibrado)" />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Vellosidad Facial:</label>
                                                    <input type="text" value={facialForm.vellosidad || ''} onChange={(e) => setFacialForm({ ...facialForm, vellosidad: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="NO, Hirsutismo, etc." />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* FORMULARIO CORPORAL COMPLETO */}
                                {(fichaTypeTab === 'body' || window.matchMedia('print').matches) && (
                                    <div className="space-y-6 text-xs text-slate-800">
                                        {/* 1. Datos Personales y Evaluación Inicial */}
                                        <div className="bg-purple-50/70 p-4 rounded-2xl border border-purple-200 space-y-3">
                                            <h4 className="font-bold text-purple-900 font-serif text-sm">1. FICHA TÉCNICA MOLDEO CORPORAL & DATOS PERSONALES</h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                <div><label className="font-bold text-slate-700 block mb-1">Nombre y Apellido:</label><input type="text" value={selectedClientForFicha.name} readOnly className="w-full p-2 rounded-xl border bg-slate-100 font-bold" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Edad:</label><input type="text" value={bodyForm.edad || ''} onChange={(e) => setBodyForm({ ...bodyForm, edad: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Teléfono:</label><input type="text" value={bodyForm.telefono || ''} onChange={(e) => setBodyForm({ ...bodyForm, telefono: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Fecha Evaluación:</label><input type="date" value={bodyForm.fechaEvaluacion || ''} onChange={(e) => setBodyForm({ ...bodyForm, fechaEvaluacion: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Ocupación:</label><input type="text" value={bodyForm.ocupacion || ''} onChange={(e) => setBodyForm({ ...bodyForm, ocupacion: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Email:</label><input type="email" value={bodyForm.email || ''} onChange={(e) => setBodyForm({ ...bodyForm, email: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                                <div className="col-span-2"><label className="font-bold text-slate-700 block mb-1">Dirección:</label><input type="text" value={bodyForm.direccion || ''} onChange={(e) => setBodyForm({ ...bodyForm, direccion: e.target.value })} className="w-full p-2 rounded-xl border bg-white" /></div>
                                            </div>
                                        </div>

                                        {/* 2. Antecedentes Clínicos y Contraindicaciones */}
                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                                            <h4 className="font-bold text-slate-900 font-serif text-sm border-b pb-1">2. ANTECEDENTES CLÍNICOS & CONTRAINDICACIONES</h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Enfermedades Crónicas:</label>
                                                    <input type="text" value={bodyForm.enfermedadesCronicas || ''} onChange={(e) => setBodyForm({ ...bodyForm, enfermedadesCronicas: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="NO / Cuadro" />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Problemas Circulatorios / Varices:</label>
                                                    <input type="text" value={bodyForm.problemasCirculatorios || ''} onChange={(e) => setBodyForm({ ...bodyForm, problemasCirculatorios: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="NO / Sí" />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Marcapasos / Prótesis Metálicas:</label>
                                                    <input type="text" value={bodyForm.marcapasosProtesis || ''} onChange={(e) => setBodyForm({ ...bodyForm, marcapasosProtesis: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="NO / Ubicación" />
                                                </div>
                                                <div>
                                                    <label className="font-bold text-slate-700 block mb-1">Embarazo / Lactancia:</label>
                                                    <input type="text" value={bodyForm.embarazoLactancia || ''} onChange={(e) => setBodyForm({ ...bodyForm, embarazoLactancia: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="NO / Sí" />
                                                </div>
                                            </div>
                                        </div>

                                        {/* 3. Estilo de Vida & Medidas Iniciales */}
                                        <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                                            <h4 className="font-bold text-slate-900 font-serif text-sm border-b pb-1">3. ESTILO DE VIDA & MEDIDAS ANTROPOMÉTRICAS INICIALES</h4>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                <div><label className="font-bold text-slate-700 block mb-1">Consumo de Agua Diario:</label><input type="text" value={bodyForm.consumoAgua || ''} onChange={(e) => setBodyForm({ ...bodyForm, consumoAgua: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="2 Litros diarios" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Actividad Física:</label><input type="text" value={bodyForm.actividadFisica || ''} onChange={(e) => setBodyForm({ ...bodyForm, actividadFisica: e.target.value })} className="w-full p-2 rounded-xl border" placeholder="Pilates 2x semana" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Peso Actual (kg):</label><input type="text" value={bodyForm.pesoActual || ''} onChange={(e) => setBodyForm({ ...bodyForm, pesoActual: e.target.value })} className="w-full p-2 rounded-xl border font-bold" /></div>
                                                <div><label className="font-bold text-slate-700 block mb-1">Estatura (cm):</label><input type="text" value={bodyForm.estatura || ''} onChange={(e) => setBodyForm({ ...bodyForm, estatura: e.target.value })} className="w-full p-2 rounded-xl border font-bold" /></div>
                                                <div className="col-span-2 sm:col-span-4"><label className="font-bold text-slate-700 block mb-1">Perímetros e Historial Medidas Iniciales:</label><input type="text" value={bodyForm.perimetroInicial || ''} onChange={(e) => setBodyForm({ ...bodyForm, perimetroInicial: e.target.value })} className="w-full p-2 rounded-xl border font-mono text-[11px]" placeholder="Abdomen Alto: 72cm | Cintura: 68cm | Abdomen Bajo: 81cm" /></div>
                                            </div>
                                        </div>

                                        {/* 4. Tabla de Seguimiento de 12 Sesiones */}
                                        <div className="space-y-3">
                                            <h4 className="font-bold text-slate-900 font-serif text-sm">4. CONTROL DE SESIONES Y SEGUIMIENTO DE EVOLUCIÓN (12 SESIONES)</h4>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-xs border border-slate-200 rounded-xl overflow-hidden">
                                                    <thead className="bg-[#212121] text-white uppercase text-[10px]">
                                                        <tr>
                                                            <th className="p-2.5 text-center w-24">N° Sesión</th>
                                                            <th className="p-2.5 w-32">Fecha Cita</th>
                                                            <th className="p-2.5">Técnicas Aplicadas</th>
                                                            <th className="p-2.5">Observaciones & Medidas Obtención</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-200 bg-white">
                                                        {Array.isArray(bodyForm.sessions) && bodyForm.sessions.map((s, idx) => (
                                                            <tr key={s.id} className="hover:bg-slate-50">
                                                                <td className="p-2 font-bold text-center bg-slate-100 text-slate-900">Sesión {s.id}</td>
                                                                <td className="p-2">
                                                                    <input type="date" value={s.fecha || ''} onChange={(e) => {
                                                                        const updated = [...bodyForm.sessions];
                                                                        updated[idx].fecha = e.target.value;
                                                                        setBodyForm({ ...bodyForm, sessions: updated });
                                                                    }} className="w-full p-1.5 border rounded-lg text-xs" />
                                                                </td>
                                                                <td className="p-2">
                                                                    <input type="text" placeholder="Ej: Maderoterapia + Cavitación" value={s.tecnicas || ''} onChange={(e) => {
                                                                        const updated = [...bodyForm.sessions];
                                                                        updated[idx].tecnicas = e.target.value;
                                                                        setBodyForm({ ...bodyForm, sessions: updated });
                                                                    }} className="w-full p-1.5 border rounded-lg text-xs" />
                                                                </td>
                                                                <td className="p-2">
                                                                    <input type="text" placeholder="Ej: Cintura antes: 68cm -> después: 67.5cm (-0.5cm)" value={s.observaciones || ''} onChange={(e) => {
                                                                        const updated = [...bodyForm.sessions];
                                                                        updated[idx].observaciones = e.target.value;
                                                                        setBodyForm({ ...bodyForm, sessions: updated });
                                                                    }} className="w-full p-1.5 border rounded-lg font-mono text-[11px]" />
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="flex gap-2 pt-3 border-t border-slate-200 no-print">
                                    <button onClick={() => setIsFichaClinicalModalOpen(false)} className="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Cancelar</button>
                                    <button onClick={handleSaveClinicalFichas} className="flex-1 py-2.5 bg-slate-900 text-white font-bold text-xs rounded-xl shadow-md">Guardar Cambios Fichas Técnicas</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL REPORTE DE VENTAS */}
                    {isReportModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 modal-print-container">
                            <div className="bg-white rounded-3xl border-2 border-[#D4AF37] max-w-4xl w-full p-6 shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center pb-3 border-b border-slate-100 no-print">
                                    <div className="flex items-center space-x-3">
                                        <span className="p-2.5 rounded-2xl bg-[#D4AF37] text-white font-bold text-lg">📑</span>
                                        <div>
                                            <h3 className="font-bold font-serif text-slate-900 text-lg">Reporte de Ventas & Arqueo POS</h3>
                                            <p className="text-xs text-slate-500">Período: <strong>{reportStartDate}</strong> al <strong>{reportEndDate}</strong></p>
                                        </div>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <button onClick={() => window.print()} className="px-4 py-2 bg-slate-900 text-white font-bold text-xs rounded-xl">🖨️ Imprimir PDF</button>
                                        <button onClick={() => setIsReportModalOpen(false)} className="text-slate-400 font-bold text-xl p-1">✕</button>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                                    <div className="p-4 rounded-2xl bg-slate-50 border"><span className="text-[10px] text-slate-500 font-bold uppercase block">Total Recaudado</span><span className="text-lg font-bold text-emerald-700 font-serif">{formatCLP(reportSummary.totalRecaudado)}</span></div>
                                    <div className="p-4 rounded-2xl bg-slate-50 border"><span className="text-[10px] text-slate-500 font-bold uppercase block">Ventas Totales</span><span className="text-lg font-bold text-slate-900 font-serif">{formatCLP(reportSummary.totalVentas)}</span></div>
                                    <div className="p-4 rounded-2xl bg-slate-50 border"><span className="text-[10px] text-slate-500 font-bold uppercase block">Saldos Pendientes</span><span className="text-lg font-bold text-rose-600 font-serif">{formatCLP(reportSummary.totalSaldos)}</span></div>
                                    <div className="p-4 rounded-2xl bg-slate-50 border"><span className="text-[10px] text-slate-500 font-bold uppercase block">Cantidad Citas</span><span className="text-lg font-bold text-slate-900 font-serif">{reportSummary.count} Atenciones</span></div>
                                </div>

                                <div className="space-y-4 pt-2 border-t border-slate-200">
                                    <h4 className="font-bold text-slate-900 font-serif text-sm">👩‍💼 Producción & Detalle Diario por Profesional:</h4>
                                    <div className="space-y-6">
                                        {profSummary.map(prof => {
                                            const dates = Object.keys(prof.dailyMap).sort().reverse();
                                            return (
                                                <div key={prof.profId} className="p-4 rounded-2xl bg-gradient-to-br from-[#FFFDF9] to-[#FAF7EE] border border-amber-200 space-y-3">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-amber-200/80">
                                                        <div className="flex items-center space-x-3">
                                                            {prof.photo ? (
                                                                <img src={prof.photo} alt={prof.profName} className="w-10 h-10 rounded-full object-cover border-2 border-[#D4AF37]" />
                                                            ) : (
                                                                <div className="w-10 h-10 rounded-full bg-[#D4AF37] text-white font-bold flex items-center justify-center text-xs">
                                                                    {prof.profName.split(' ').map(n=>n[0]).join('').substring(0,2)}
                                                                </div>
                                                            )}
                                                            <div>
                                                                <h5 className="font-bold text-slate-900 text-sm">{prof.profName}</h5>
                                                                <span className="text-[10px] text-[#B38F2D] font-bold uppercase">{prof.specialty || prof.role}</span>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-3 text-xs font-bold">
                                                            <div className="p-2 rounded-xl bg-white border border-slate-200">
                                                                <span className="text-[9px] text-slate-400 block uppercase">Servicios</span>
                                                                <span className="text-slate-900">{prof.totalServices} atenciones</span>
                                                            </div>
                                                            <div className="p-2 rounded-xl bg-white border border-slate-200">
                                                                <span className="text-[9px] text-slate-400 block uppercase">Ventas Generadas</span>
                                                                <span className="text-[#B38F2D]">{formatCLP(prof.totalSales)}</span>
                                                            </div>
                                                            <div className="p-2 rounded-xl bg-emerald-50 border border-emerald-200">
                                                                <span className="text-[9px] text-emerald-600 block uppercase">Recaudado</span>
                                                                <span className="text-emerald-800">{formatCLP(prof.totalPaid)}</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {dates.length === 0 ? (
                                                        <p className="text-slate-400 italic text-[11px]">Sin atenciones registradas en el período.</p>
                                                    ) : (
                                                        dates.map(dateKey => (
                                                            <div key={dateKey} className="space-y-1">
                                                                <div className="font-bold font-mono text-[11px] text-slate-700 bg-amber-100/60 px-2 py-1 rounded-md">
                                                                    📅 {dateKey}
                                                                </div>
                                                                <div className="divide-y divide-slate-100 pl-2">
                                                                    {prof.dailyMap[dateKey].map((item, idx) => (
                                                                        <div key={idx} className="py-1 flex justify-between items-center text-[10px]">
                                                                            <div>
                                                                                <span className="font-bold text-slate-800">{item.time} — {item.clientName}</span>
                                                                                <span className="text-slate-500 block">{item.serviceName} ({item.paymentMethod})</span>
                                                                            </div>
                                                                            <div className="text-right">
                                                                                <span className="font-bold text-slate-900 block">{formatCLP(item.price)}</span>
                                                                                <span className="text-emerald-700 font-bold block">Pagado: {formatCLP(item.paidAmount)}</span>
                                                                            </div>
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="no-print pt-2 border-t border-slate-100 flex justify-end">
                                    <button onClick={() => setIsReportModalOpen(false)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Cerrar Reporte</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* Modal para Imprimir Gift Card */}
                    {selectedGiftCardForPrint && (
                        <div className="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center p-4 modal-print-container">
                            <div className="bg-white rounded-3xl border-2 border-[#D4AF37] max-w-lg w-full p-6 shadow-2xl space-y-6">
                                <div className="flex justify-between items-center pb-2 border-b border-slate-100 no-print">
                                    <h3 className="font-bold font-serif text-slate-900 text-base">🎁 Imprimir Gift Card Diva</h3>
                                    <div className="flex items-center space-x-2">
                                        <button onClick={() => window.print()} className="px-3.5 py-2 bg-[#D4AF37] hover:bg-[#B38F2D] text-white font-bold text-xs rounded-xl shadow-md">🖨️ Imprimir / PDF</button>
                                        <button onClick={() => setSelectedGiftCardForPrint(null)} className="text-slate-400 font-bold text-lg p-1">✕</button>
                                    </div>
                                </div>

                                <div className="p-8 rounded-3xl bg-gradient-to-br from-[#FAF7EE] via-[#FFFDF9] to-[#F4EEDC] border-2 border-[#D4AF37] space-y-6 text-center shadow-xl relative overflow-hidden">
                                    <div className="space-y-2">
                                        <img src={OFFICIAL_LOGO} alt="SPA DIVAS ELEY" className="h-16 mx-auto object-contain" />
                                        <h2 className="text-xl font-bold font-serif text-slate-900 tracking-wider">SPA DIVAS ELEY</h2>
                                        <p className="text-[10px] text-[#B38F2D] font-serif font-bold italic">{BRAND_SLOGAN}</p>
                                    </div>

                                    <div className="py-3 border-y border-[#D4AF37]/40 space-y-2">
                                        <span className="text-[10px] font-bold text-[#8C6E20] uppercase tracking-widest block">GIFT CARD / VOUCHER DE REGALO</span>
                                        <h3 className="text-2xl font-bold font-serif text-slate-900">{selectedGiftCardForPrint.serviceName}</h3>
                                        <div className="text-3xl font-bold font-serif text-[#B38F2D] mt-1">{formatCLP(selectedGiftCardForPrint.amount)}</div>
                                    </div>

                                    <div className="text-xs space-y-2 text-slate-700 text-left bg-white/80 p-4 rounded-2xl border border-amber-200">
                                        <p>👤 <strong>Para:</strong> {selectedGiftCardForPrint.recipientName}</p>
                                        <p>💝 <strong>De parte de:</strong> {selectedGiftCardForPrint.senderName}</p>
                                        {selectedGiftCardForPrint.message && <p className="italic text-slate-600">💬 "{selectedGiftCardForPrint.message}"</p>}
                                        <p className="pt-1">📅 <strong>Válida hasta:</strong> {selectedGiftCardForPrint.expirationDate}</p>
                                    </div>

                                    <div className="pt-2 flex justify-between items-center text-xs border-t border-[#D4AF37]/30">
                                        <div className="text-left">
                                            <p className="text-[10px] text-slate-500 font-bold">CÓDIGO DE CANJE:</p>
                                            <p className="font-mono text-sm font-bold text-[#B38F2D]">{selectedGiftCardForPrint.code}</p>
                                        </div>
                                        <div className="text-right text-[9px] text-slate-500 max-w-[200px]">
                                            <p className="font-bold text-slate-800">{SPA_ADDRESS}</p>
                                            <p>Presentar este voucher al agendar tu cita.</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="no-print pt-2 border-t border-slate-100 flex justify-end">
                                    <button onClick={() => setSelectedGiftCardForPrint(null)} className="px-5 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl">Cerrar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-5 py-3.5 rounded-2xl text-xs font-bold shadow-2xl transition-all flex items-center space-x-2 ${toast.type === 'error' ? 'bg-rose-600 text-white' : 'bg-[#212121] text-white border border-[#D4AF37]'}`}>
                            <span>{toast.type === 'error' ? '⚠️' : '✨'}</span>
                            <span>{toast.message}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
