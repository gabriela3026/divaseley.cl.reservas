                                <button 
                                    onClick={() => setFilterPeriod('DAY')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                        filterPeriod === 'DAY' ? 'bg-divas-600 text-white shadow-md' : 'text-gray-600 hover:text-divas-900'
                                    }`}>
                                    📅 Hoy (Día)
                                </button>
                                <button 
                                    onClick={() => setFilterPeriod('MONTH')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                        filterPeriod === 'MONTH' ? 'bg-divas-600 text-white shadow-md' : 'text-gray-600 hover:text-divas-900'
                                    }`}>
                                    🗓️ Este Mes
                                </button>
                                <button 
                                    onClick={() => setFilterPeriod('YEAR')}
                                    className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${
                                        filterPeriod === 'YEAR' ? 'bg-divas-600 text-white shadow-md' : 'text-gray-600 hover:text-divas-900'
                                    }`}>
                                    📊 Año Completo
                                </button>
                            </div>
                        </div>

                        {/* PROFESSIONAL SALES CARDS GRID */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {professionalSales.map((item, idx) => {
                                const percentageContribution = periodTotalRevenue > 0 
                                    ? Math.round((item.totalRevenue / periodTotalRevenue) * 100) 
                                    : 0;

                                const avgPerService = item.serviceCount > 0 
                                    ? Math.round(item.totalRevenue / item.serviceCount) 
                                    : 0;

                                return (
                                    <div key={item.user.id || idx} className="p-5 border border-gray-200 rounded-2xl bg-white shadow-sm hover:shadow-md transition-all space-y-4">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center space-x-3">
                                                <img src={item.user.photo} alt={item.user.name} className="w-12 h-12 rounded-2xl object-cover border-2 border-divas-300" />
                                                <div>
                                                    <h4 className="font-bold text-sm text-divas-900">{item.user.name}</h4>
                                                    <p className="text-[11px] text-gray-500">{item.user.specialty}</p>
                                                </div>
                                            </div>
                                            <span className="w-8 h-8 rounded-full bg-divas-50 text-divas-700 font-extrabold text-xs flex items-center justify-center">
                                                #{idx + 1}
                                            </span>
                                        </div>

                                        <div className="bg-divas-50/50 p-4 rounded-xl border border-divas-100 flex items-center justify-between">
                                            <div>
                                                <span className="text-[10px] text-gray-500 font-bold uppercase block">Total Generado</span>
                                                <span className="text-xl font-black text-divas-900">${item.totalRevenue.toLocaleString('es-CL')}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-[10px] text-gray-500 font-bold uppercase block">Aporte Venta</span>
                                                <span className="text-lg font-bold text-divas-600">{percentageContribution}%</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 text-xs">
                                            <div className="p-2.5 bg-gray-50 rounded-xl border border-gray-100">
                                                <span className="text-[10px] text-gray-400 font-bold block">Servicios Realizados:</span>
                                                <span className="font-extrabold text-gray-800 text-sm">{item.serviceCount} servicios</span>
                                            </div>

                                            <div className="p-2.5 bg-gray-50 rounded-xl border border-gray-100">
                                                <span className="text-[10px] text-gray-400 font-bold block">Ticket Promedio:</span>
                                                <span className="font-extrabold text-gray-800 text-sm">${avgPerService.toLocaleString('es-CL')}</span>
                                            </div>
                                        </div>

                                        <div className="space-y-1 pt-2">
                                            <div className="flex justify-between text-[10px] text-gray-500 font-bold">
                                                <span>Progreso sobre el total</span>
                                                <span>{percentageContribution}%</span>
                                            </div>
                                            <div className="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                                                <div className="bg-divas-600 h-full rounded-full transition-all duration-500" style={{ width: `${percentageContribution}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function FirebaseConfigView({ firebaseConfig, setFirebaseConfig, firebaseConnected, setFirebaseConnected, notify }) {
            return (
                <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-6">
                    <div>
                        <h3 className="text-lg font-bold font-serif-title text-divas-900">Configuración de Firebase & Firestore Cloud</h3>
                        <p className="text-xs text-gray-500">Parámetros de conexión a la base de datos en la nube para sincronización multi-dispositivo</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div>
                            <label className="block text-gray-600 font-bold mb-1">API Key</label>
                            <input 
                                type="text" 
                                value={firebaseConfig.apiKey}
                                onChange={e => setFirebaseConfig({ ...firebaseConfig, apiKey: e.target.value })}
                                placeholder="AIzaSy..." 
                                className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl"
                            />
                        </div>

                        <div>
                            <label className="block text-gray-600 font-bold mb-1">Auth Domain</label>
                            <input 
                                type="text" 
                                value={firebaseConfig.authDomain}
                                onChange={e => setFirebaseConfig({ ...firebaseConfig, authDomain: e.target.value })}
                                className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl"
                            />
                        </div>

                        <div>
                            <label className="block text-gray-600 font-bold mb-1">Project ID</label>
                            <input 
                                type="text" 
                                value={firebaseConfig.projectId}
                                onChange={e => setFirebaseConfig({ ...firebaseConfig, projectId: e.target.value })}
                                className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl font-bold text-divas-900"
                            />
                        </div>

                        <div>
                            <label className="block text-gray-600 font-bold mb-1">Storage Bucket</label>
                            <input 
                                type="text" 
                                value={firebaseConfig.storageBucket}
                                onChange={e => setFirebaseConfig({ ...firebaseConfig, storageBucket: e.target.value })}
                                className="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-xl"
                            />
                        </div>
                    </div>

                    <div className="pt-4 border-t border-gray-100 flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                            <span className={`w-3 h-3 rounded-full ${firebaseConnected ? 'bg-emerald-500 animate-pulse' : 'bg-amber-500'}`}></span>
                            <span className="text-xs font-bold text-gray-700">
                                Estado: {firebaseConnected ? 'Sincronizado con Firebase' : 'Modo Persistencia Local (LocalStorage)'}
                            </span>
                        </div>

                        <button 
                            onClick={() => {
                                setFirebaseConnected(!firebaseConnected);
                                notify(firebaseConnected ? 'Cambiado a LocalStorage' : 'Conectado a Firebase Firestore');
                            }}
                            className={`px-4 py-2 rounded-xl text-xs font-bold text-white transition-all ${firebaseConnected ? 'bg-amber-600 hover:bg-amber-700' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
                            {firebaseConnected ? 'Desconectar Firebase' : 'Activar Sincronización Real'}
                        </button>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
