                const parsed = JSON.parse(local);
                return parsed || fallback;
            } catch (e) {
                console.warn(`SafeStorage read error for ${key}:`, e);

            }
        }

                                <p className="text-xs text-gray-500 font-mono bg-gray-50 p-3 rounded-xl border border-gray-200 overflow-x-auto text-left">
                                    {this.state.error?.toString()}
                                </p>
                                <button 
                                    onClick={() => {
                                        try { localStorage.clear(); } catch(e){}
                                        window.location.reload();
                                    }}
                                    className="w-full py-3 bg-divas-600 hover:bg-divas-700 text-white font-bold text-xs rounded-xl shadow-lg">
                                    Restablecer Estado Local y Recargar
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [users, setUsers] = useState(() => getSafeStorage('divas_users', INITIAL_USER_ACCOUNTS));
            const [currentUser, setCurrentUser] = useState(() => users[0] || INITIAL_USER_ACCOUNTS[0]);
            const [isLogged, setIsLogged] = useState(true);
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            
            const [currentTab, setCurrentTab] = useState('dashboard');

            const [catalog, setCatalog] = useState(() => {
                const stored = getSafeStorage('divas_catalog', null);
                return (stored && stored.length >= 10) ? stored : INITIAL_CATALOG;
            });
            const [clients, setClients] = useState(() => getSafeStorage('divas_clients', INITIAL_CLIENTS));
            const [appointments, setAppointments] = useState(() => getSafeStorage('divas_appointments', INITIAL_APPOINTMENTS));
            const [facialRecords, setFacialRecords] = useState(() => getSafeStorage('divas_facial_records', INITIAL_FACIAL_RECORDS));
            const [bodyRecords, setBodyRecords] = useState(() => getSafeStorage('divas_body_records', INITIAL_BODY_RECORDS));

            const [isCartModalOpen, setIsCartModalOpen] = useState(false);
            const [editingAppointment, setEditingAppointment] = useState(null);
            
            const [selectedClientForProfile, setSelectedClientForProfile] = useState(null);
            const [isClientModalOpen, setIsClientModalOpen] = useState(false);
            const [clientToEdit, setClientToEdit] = useState(null);

            const [isEditUserModalOpen, setIsEditUserModalOpen] = useState(false);
            const [userToEdit, setUserToEdit] = useState(null);

            const [isEditServiceModalOpen, setIsEditServiceModalOpen] = useState(false);
            const [serviceToEdit, setServiceToEdit] = useState(null);

            const [isNotification, setIsNotification] = useState({ show: false, message: '', type: 'success' });
            
            const [firebaseConnected, setFirebaseConnected] = useState(false);
            const [firebaseConfig, setFirebaseConfig] = useState({
                apiKey: "",
                authDomain: "divas-eley-spa.firebaseapp.com",
                projectId: "divas-eley-spa",
                storageBucket: "divas-eley-spa.appspot.com",
                messagingSenderId: "",
                appId: ""
            });

            useEffect(() => {
                setSafeStorage('divas_users', users);
                setSafeStorage('divas_catalog', catalog);
                setSafeStorage('divas_clients', clients);
                setSafeStorage('divas_appointments', appointments);
                setSafeStorage('divas_facial_records', facialRecords);
                setSafeStorage('divas_body_records', bodyRecords);
            }, [users, catalog, clients, appointments, facialRecords, bodyRecords]);

            const notify = (message, type = 'success') => {
                setIsNotification({ show: true, message, type });
                setTimeout(() => setIsNotification({ show: false, message: '', type: 'success' }), 3500);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const found = (users || []).find(u => u.email.toLowerCase() === loginEmail.toLowerCase());
                if (found && found.password === loginPassword) {
                    setCurrentUser(found);
                    setIsLogged(true);
                    if (found.role === 'PROFESIONAL') {
                        setCurrentTab('agenda');
                    }
                    notify(`Bienvenida ${found.name} (${found.role})`);
                } else {
                    notify('Credenciales inválidas. Verifica tu correo y contraseña.', 'error');
                }
            };

            const handleLogout = () => {
                setIsLogged(false);
                notify('Sesión cerrada correctamente');
            };

            const switchUserRole = (userId) => {
                const target = (users || []).find(u => u.id === userId);
                if (target) {
                    setCurrentUser(target);
                    if (target.role === 'PROFESIONAL') {
                        setCurrentTab('agenda');
                    }
                    notify(`Cambio de usuario activo: ${target.name} (${target.role})`);
                }
            };

            const isAdmin = currentUser?.role === 'ADMIN'; // Gabriela Manrique & Nicol Inostroza
            const isRecepcion = currentUser?.role === 'RECEPCION';
            const isProfesional = currentUser?.role === 'PROFESIONAL';

            const canAdmin = isAdmin;
            const canOperate = isAdmin || isRecepcion;

            const handleSaveUser = (savedUser) => {
                setUsers(prev => {
                    const idx = prev.findIndex(u => u.id === savedUser.id);
                    if (idx >= 0) {
                        const copy = [...prev];
                        copy[idx] = savedUser;
                        return copy;
                    }
                    return [...prev, savedUser];
                });
                if (currentUser && savedUser.id === currentUser.id) {
                    setCurrentUser(savedUser);
                }
                setIsEditUserModalOpen(false);
                setUserToEdit(null);
                notify('Información de usuario actualizada correctamente.');
            };

            const handleSaveService = (savedService) => {
                setCatalog(prev => {
                    const idx = prev.findIndex(s => s.id === savedService.id);
                    if (idx >= 0) {
                        const copy = [...prev];
                        copy[idx] = savedService;
                        return copy;
                    }
                    return [savedService, ...prev];
                });
                setIsEditServiceModalOpen(false);
                setServiceToEdit(null);
                notify('Servicio guardado en catálogo con éxito.');
            };

            const handleDeleteService = (serviceId) => {
                setCatalog(prev => prev.filter(s => s.id !== serviceId));
                notify('Servicio eliminado del catálogo.');
            };

            const handleSaveClient = (savedClient) => {
                setClients(prev => {
                    const idx = prev.findIndex(c => c.id === savedClient.id);
                    if (idx >= 0) {
                        const copy = [...prev];
                        copy[idx] = savedClient;
                        return copy;
                    }
                    return [savedClient, ...prev];
                });

                if (selectedClientForProfile && selectedClientForProfile.id === savedClient.id) {
                    setSelectedClientForProfile(savedClient);
                }

                setIsClientModalOpen(false);
                setClientToEdit(null);
                notify('Datos de clienta guardados correctamente.');
            };

            const handleSaveAppointment = (savedApt) => {
                setAppointments(prev => {
                    const idx = prev.findIndex(a => a.id === savedApt.id);
                    if (idx >= 0) {
                        const copy = [...prev];
                        copy[idx] = savedApt;
                        return copy;
                    }
                    return [savedApt, ...prev];
                });
                setIsCartModalOpen(false);
                setEditingAppointment(null);
                notify('Cita procesada y registrada exitosamente.');
            };

            const handleUpdateEFECTIVOStatus = (aptId, newStatus, newMethod) => {
                setAppointments(prev => prev.map(a => {
                    if (a.id === aptId) {
                        return { ...a, paymentStatus: newStatus, paymentMethod: newMethod };
                    }
                    return a;
                }));
                notify('Cobro de cita actualizado.');
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#f9f6f8] text-gray-800">
                    
                    {/* TOAST NOTIFICATION */}
                    {isNotification.show && (
                        <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-white transition-all transform slide-in-from-top ${isNotification.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            <i className={`fa-solid ${isNotification.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                            <span className="font-semibold text-xs sm:text-sm">{isNotification.message}</span>
                        </div>
                    )}

                    {!isLogged ? (
                        /* LOGIN SCREEN */
                        <div className="w-full min-h-screen flex items-center justify-center bg-gradient-to-br from-divas-900 via-divas-800 to-divas-dark p-4">
                            <div className="bg-white/95 backdrop-blur-md w-full max-w-md p-8 rounded-3xl shadow-2xl border border-divas-200">
                                <div className="text-center mb-8">
                                    <div className="inline-flex items-center justify-center w-20 h-20 bg-divas-100 rounded-full mb-3 text-divas-700 shadow-inner">
                                        <i className="fa-solid fa-spa text-4xl"></i>
                                    </div>
                                    <h1 className="text-3xl font-bold font-serif-title tracking-wide text-divas-900">SPA DIVAS ELEY</h1>
                                    <p className="text-sm text-divas-600 font-medium tracking-widest uppercase mt-1">Gestión Médica Estética & Wellness</p>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Correo Electrónico</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
                                            <input 
                                                type="email" 
                                                required
                                                value={loginEmail} 
                                                onChange={e => setLoginEmail(e.target.value)}
                                                placeholder="ejemplo@divaseley.cl" 
                                                className="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-divas-500 focus:outline-none text-sm"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Contraseña</label>
                                        <div className="relative">
                                            <i className="fa-solid fa-lock absolute left-4 top-3.5 text-gray-400"></i>
                                            <input 
                                                type={showPassword ? "text" : "password"} 
                                                required
                                                value={loginPassword} 
                                                onChange={e => setLoginPassword(e.target.value)}
                                                placeholder="••••••••" 
                                                className="w-full pl-11 pr-12 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-divas-500 focus:outline-none text-sm"
                                            />
                                            <button 
                                                type="button" 
                                                onClick={() => setShowPassword(!showPassword)}
                                                className="absolute right-4 top-3.5 text-gray-400 hover:text-divas-600">
                                                <i className={`fa-solid ${showPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full py-3.5 bg-divas-600 hover:bg-divas-700 text-white font-bold rounded-xl shadow-lg shadow-divas-600/30 transition-all flex items-center justify-center space-x-2">
                                        <span>INICIAR SESIÓN</span>
                                        <i className="fa-solid fa-arrow-right"></i>
                                    </button>
                                </form>

                                <div className="mt-8 pt-6 border-t border-gray-100">
                                    <p className="text-xs font-semibold text-gray-400 uppercase text-center mb-3">RECUERDA AVISAR CON TIEMPO TU RESERVA PARA SUBIRLA AL SISTEMA</p>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                    
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <>
                            <aside className="w-full md:w-64 bg-divas-900 text-white flex-shrink-0 flex flex-col justify-between min-h-screen">
                                <div>
                                    <div className="p-5 border-b border-divas-800/60 flex items-center space-x-3">
                                        <div className="w-10 h-10 bg-divas-500 rounded-xl flex items-center justify-center shadow-md">
                                            <i className="fa-solid fa-spa text-white text-xl"></i>
                                        </div>
                                        <div>
                                            <h2 className="font-serif-title text-lg font-bold tracking-wide">DIVAS ELEY</h2>
                                            <span className="text-[10px] text-divas-300 tracking-widest uppercase block">Medical Spa System</span>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-divas-800/40 border-b border-divas-800/60 flex items-center justify-between">
                                        <div className="flex items-center space-x-3">
                                            <img src={currentUser?.photo} alt={currentUser?.name} className="w-10 h-10 rounded-full object-cover border-2 border-divas-400" />
                                            <div className="overflow-hidden">
                                                <p className="text-xs font-bold truncate text-white">{currentUser?.name}</p>
                                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-divas-700 text-divas-200 font-semibold inline-block">
                                                    {currentUser?.role}
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                    <nav className="p-3 space-y-1">
                                        {!isProfesional && (
                                            <NavButton active={currentTab === 'dashboard'} onClick={() => setCurrentTab('dashboard')} icon="fa-chart-pie" label="Dashboard" />
                                        )}
                                        <NavButton 
                                            active={currentTab === 'agenda'} 
                                            onClick={() => setCurrentTab('agenda')} 
                                            icon="fa-calendar-days" 
                                            label={isProfesional ? "Mis Reservaciones" : "Agenda & Citas"} 
                                        />
                                        
                                        {/* HIDE CRM FOR PROFESSIONALS, ADD PERSONAL EARNINGS TAB */}
                                        {!isProfesional && (
                                            <NavButton active={currentTab === 'clients'} onClick={() => setCurrentTab('clients')} icon="fa-users" label="Clientas & CRM" />
                                        )}

                                        {isProfesional && (
                                            <NavButton active={currentTab === 'earnings'} onClick={() => setCurrentTab('earnings')} icon="fa-wallet text-emerald-400" label="Mis Ganancias" />
                                        )}
                                        
                                        {!isProfesional && (
                                            <>
                                                <NavButton active={currentTab === 'catalog'} onClick={() => setCurrentTab('catalog')} icon="fa-wand-magic-sparkles" label="Catálogo Servicios" />
                                                <NavButton active={currentTab === 'team'} onClick={() => setCurrentTab('team')} icon="fa-user-nurse" label="Equipo & Asistencia" />
                                                <NavButton active={currentTab === 'EFECTIVO'} onClick={() => setCurrentTab('EFECTIVO')} icon="fa-EFECTIVO-register" label="Caja & Pagos" />
                                            </>
                                        )}

                                        {canAdmin && (
                                            <>
                                                <NavButton active={currentTab === 'reports'} onClick={() => setCurrentTab('reports')} icon="fa-chart-line" label="Reportes & Métricas" />
                                                <NavButton active={currentTab === 'firebase'} onClick={() => setCurrentTab('firebase')} icon="fa-fire text-amber-400" label="Firebase & Config" />
                                            </>
                                        )}
                                    </nav>
                                </div>

                                <div className="p-4 border-t border-divas-800/60 space-y-3">
                                    <div className="text-xs">
                                        <label className="block text-divas-300 mb-1 text-[10px] uppercase font-bold">Cambiar Rol Activo (Test)</label>
                                        <select 
                                            value={currentUser?.id} 
                                            onChange={(e) => switchUserRole(e.target.value)}
                                            className="w-full bg-divas-800 text-xs text-white p-2 rounded-lg border border-divas-700">
                                            {(users || []).map(u => (
                                                <option key={u.id} value={u.id}>
                                                    {u.name} ({u.role})
                                                </option>
                                            ))}
                                        </select>
                                    </div>

                                    <button 
                                        onClick={handleLogout}
                                        className="w-full py-2 bg-divas-800 hover:bg-red-900 text-divas-200 hover:text-white rounded-lg text-xs font-semibold flex items-center justify-center space-x-2 transition-all">
                                        <i className="fa-solid fa-right-from-bracket"></i>
                                        <span>Cerrar Sesión</span>
                                    </button>
                                </div>
                            </aside>

                            <main className="flex-1 flex flex-col min-w-0 overflow-y-auto max-h-screen">
                                <header className="bg-white border-b border-gray-200 p-4 sticky top-0 z-20 flex items-center justify-between shadow-sm">
                                    <div className="flex items-center space-x-3">
                                        <h1 className="text-xl font-bold font-serif-title text-divas-900 capitalize">
                                            {currentTab === 'dashboard' && 'Dashboard Principal'}
                                            {currentTab === 'agenda' && (isProfesional ? `Mis Reservaciones — ${currentUser?.name}` : 'Agenda Médica & Servicios')}
                                            {currentTab === 'clients' && 'Directorio de Clientas & Fichas'}
                                            {currentTab === 'earnings' && `Mis Ganancias & Producción — ${currentUser?.name}`}
                                            {currentTab === 'catalog' && 'Servicios & Tarifario Global'}
                                            {currentTab === 'team' && 'Gestión de Equipo & Control Asistencia'}
                                            {currentTab === 'EFECTIVO' && 'Caja Diaria & Historial de Pagos'}
                                            {currentTab === 'reports' && 'Reportes Financieros & Ventas por Profesional'}
                                            {currentTab === 'firebase' && 'Configuración de Firebase & Firestore'}
                                        </h1>
                                        {isProfesional && (
                                            <span className="text-xs bg-pink-100 text-divas-800 font-bold px-3 py-1 rounded-full border border-pink-200">
                                                🔒 Vista Personal Restringida
                                            </span>
                                        )}
                                    </div>

                                    <div className="flex items-center space-x-3">
                                        {canOperate && (
                                            <button 
                                                onClick={() => { setEditingAppointment(null); setIsCartModalOpen(true); }}
                                                className="px-4 py-2 bg-divas-600 hover:bg-divas-700 text-white rounded-xl text-xs font-bold shadow-md shadow-divas-600/20 flex items-center space-x-2">
                                                <i className="fa-solid fa-cart-plus"></i>
                                                <span className="hidden sm:inline">+ NUEVA CITA (CARRITO)</span>
                                            </button>
                                        )}
                                        {canOperate && (
                                            <button 
                                                onClick={() => { setClientToEdit(null); setIsClientModalOpen(true); }}
                                                className="px-4 py-2 bg-divas-100 hover:bg-divas-200 text-divas-800 rounded-xl text-xs font-bold flex items-center space-x-2">
                                                <i className="fa-solid fa-user-plus"></i>
                                                <span className="hidden sm:inline">+ NUEVA CLIENTA</span>
                                            </button>
                                        )}
                                    </div>
                                </header>

                                <div className="p-4 sm:p-6 space-y-6 flex-1">
                                    {currentTab === 'dashboard' && !isProfesional && (
                                        <DashboardView 
                                            appointments={appointments}
                                            clients={clients}
                                            users={users}
                                            onOpenAppointment={(apt) => {
                                                if (canOperate) {
                                                    setEditingAppointment(apt);
                                                    setIsCartModalOpen(true);
                                                }
                                            }}
                                        />
                                    )}

                                    {currentTab === 'agenda' && (
                                        <AgendaView 
                                            appointments={appointments}
                                            users={users}
                                            currentUser={currentUser}
                                            canOperate={canOperate}
                                            onOpenAppointment={(apt) => {
                                                if (canOperate) {
                                                    setEditingAppointment(apt); 
                                                    setIsCartModalOpen(true);
                                                } else {
                                                    notify(`Reserva de ${apt.clientName}. Solo Administradoras (Gabriela y Nicol) pueden editar.`, 'error');
                                                }
                                            }}
                                            onNewAppointmentWithTime={(date, time) => {
                                                if (canOperate) {
                                                    setEditingAppointment({ date, startTime: time, services: [] });
                                                    setIsCartModalOpen(true);
                                                } else {
                                                    notify('Solo la administración o recepción pueden crear nuevas citas.', 'error');
                                                }
                                            }}
                                        />
                                    )}

                                    {/* HIDE CRM FOR PROFESSIONALS */}
                                    {currentTab === 'clients' && !isProfesional && (
                                        <ClientsView 
                                            clients={clients}
                                            facialRecords={facialRecords}
                                            bodyRecords={bodyRecords}
                                            appointments={appointments}
                                            onSelectClient={(cli) => setSelectedClientForProfile(cli)}
                                            onEditClient={(cli) => { setClientToEdit(cli); setIsClientModalOpen(true); }}
                                            onOpenNewClientModal={() => { setClientToEdit(null); setIsClientModalOpen(true); }}
                                        />
                                    )}

                                    {/* PROFESSIONAL EARNINGS VIEW */}
                                    {currentTab === 'earnings' && isProfesional && (
                                        <ProfessionalEarningsView 
                                            currentUser={currentUser}
                                            appointments={appointments}
                                        />
                                    )}

                                    {currentTab === 'catalog' && !isProfesional && (
                                        <CatalogView 
                                            catalog={catalog}
                                            onUpdateCatalog={setCatalog}
                                            canAdmin={canAdmin}
                                            onEditService={(srv) => { setServiceToEdit(srv); setIsEditServiceModalOpen(true); }}
                                            onAddNewService={() => { setServiceToEdit(null); setIsEditServiceModalOpen(true); }}
                                            onDeleteService={handleDeleteService}
                                        />
                                    )}

                                    {currentTab === 'team' && !isProfesional && (
                                        <TeamView 
                                            users={users}
                                            onUpdateUsers={setUsers}
                                            canAdmin={canAdmin}
                                            onEditUser={(u) => { setUserToEdit(u); setIsEditUserModalOpen(true); }}
                                            onAddNewUser={() => { setUserToEdit(null); setIsEditUserModalOpen(true); }}
                                        />
                                    )}

                                    {currentTab === 'EFECTIVO' && !isProfesional && (
                                        <EFECTIVODeskView 
                                            appointments={appointments}
                                            onUpdateAppointmentStatus={handleUpdateEFECTIVOStatus}
                                        />
                                    )}

                                    {currentTab === 'reports' && canAdmin && (
                                        <ReportsView 
                                            appointments={appointments}
                                            catalog={catalog}
                                            users={users}
                                        />
                                    )}

                                    {currentTab === 'firebase' && canAdmin && (
                                        <FirebaseConfigView 
                                            firebaseConfig={firebaseConfig}
                                            setFirebaseConfig={setFirebaseConfig}
                                            firebaseConnected={firebaseConnected}
                                            setFirebaseConnected={setFirebaseConnected}
                                            notify={notify}
                                        />
                                    )}
                                </div>
                            </main>
                        </>
                    )}

                    {/* MODALS */}
                    {isCartModalOpen && (
                        <AppointmentCartModal 
                            isOpen={isCartModalOpen}
                            onClose={() => { setIsCartModalOpen(false); setEditingAppointment(null); }}
                            appointment={editingAppointment}
                            clients={clients}
                            catalog={catalog}
                            users={users}
                            appointments={appointments}
                            currentUser={currentUser}
                            notify={notify}
                            onSaveAppointment={handleSaveAppointment}
                        />
                    )}

                    {isClientModalOpen && (
                        <EditClientModal 
                            isOpen={isClientModalOpen}
                            onClose={() => { setIsClientModalOpen(false); setClientToEdit(null); }}
                            client={clientToEdit}
                            users={users}
                            onSaveClient={handleSaveClient}
                        />
                    )}

                    {selectedClientForProfile && (
                        <ClientProfileModal 
                            client={selectedClientForProfile}
                            onClose={() => setSelectedClientForProfile(null)}
                            facialRecord={facialRecords[selectedClientForProfile.id]}
                            bodyRecord={bodyRecords[selectedClientForProfile.id]}
                            appointments={appointments.filter(a => a.clientId === selectedClientForProfile.id)}
                            onEditClientProfile={(cli) => { setSelectedClientForProfile(null); setClientToEdit(cli); setIsClientModalOpen(true); }}
                            onSaveFacialRecord={(record) => {
                                setFacialRecords(prev => ({ ...prev, [record.clientId]: record }));
                                notify('Ficha facial guardada correctamente');
                            }}
                            onSaveBodyRecord={(record) => {
                                setBodyRecords(prev => ({ ...prev, [record.clientId]: record }));
                                notify('Ficha corporal guardada correctamente');
                            }}
                        />
                    )}

                    {isEditUserModalOpen && (
                        <EditUserModal 
                            isOpen={isEditUserModalOpen}
                            onClose={() => { setIsEditUserModalOpen(false); setUserToEdit(null); }}
                            user={userToEdit}
                            onSaveUser={handleSaveUser}
                        />
                    )}

                    {isEditServiceModalOpen && (
                        <EditServiceModal 
                            isOpen={isEditServiceModalOpen}
                            onClose={() => { setIsEditServiceModalOpen(false); setServiceToEdit(null); }}
                            service={serviceToEdit}
                            onSaveService={handleSaveService}
                        />
                    )}
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label }) {
            return (
                <button 
                    onClick={onClick} 
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${active ? 'bg-divas-600 text-white shadow-lg shadow-divas-600/30' : 'text-divas-200 hover:bg-divas-800 hover:text-white'}`}>
                    <i className={`fa-solid ${icon} text-sm w-5 text-center`}></i>
                    <span>{label}</span>
                </button>
            );
        }

            const [selectedDate, setSelectedDate] = useState(TODAY_STR);
            const [selectedMonth, setSelectedMonth] = useState(TODAY_STR.substring(0, 7)); // YYYY-MM
            const [selectedYear, setSelectedYear] = useState(TODAY_STR.substring(0, 4)); // YYYY
            
            // Lock filter to current user if professional, else allow choosing
            const [selectedProfFilter, setSelectedProfFilter] = useState(isProfesional ? currentUser.id : 'ALL');

            useEffect(() => {
                if (isProfesional) {
                    setSelectedProfFilter(currentUser.id);
                }
            }, [currentUser, isProfesional]);

            const timeSlots = [
                '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', 
                '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'
            ];

            const filteredApts = (appointments || []).filter(a => {
                if (!a) return false;
                
                // Period filter check
                let matchPeriod = false;
                if (viewMode === 'DAY') {
                    matchPeriod = a.date === selectedDate;
                } else if (viewMode === 'MONTH') {
                    matchPeriod = a.date && a.date.startsWith(selectedMonth);
                } else if (viewMode === 'YEAR') {
                    matchPeriod = a.date && a.date.startsWith(selectedYear);
                }

                if (!matchPeriod) return false;

                // Professional filter check
                const targetProf = isProfesional ? currentUser.id : selectedProfFilter;
                if (targetProf === 'ALL') return true;
                return (a.services || []).some(s => s.professionalId === targetProf);
            });

                <div className="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-6">
                    {/* TOP CONTROLS & FILTER BAR */}
                    <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-4 border-b border-gray-100">
                        <div className="flex flex-wrap items-center gap-3">
                            {/* PERIOD TOGGLES */}
                            <div className="flex items-center space-x-1 bg-gray-100 p-1 rounded-xl">
                                <button 
                                    onClick={() => setViewMode('DAY')}
                                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode === 'DAY' ? 'bg-divas-600 text-white shadow-sm' : 'text-gray-600 hover:text-divas-900'}`}>
                                    📅 Por Día
                                </button>
                                <button 
                                    onClick={() => setViewMode('MONTH')}
                                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode === 'MONTH' ? 'bg-divas-600 text-white shadow-sm' : 'text-gray-600 hover:text-divas-900'}`}>
                                    🗓️ Por Mes
                                </button>
                                <button 
                                    onClick={() => setViewMode('YEAR')}
                                    className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${viewMode === 'YEAR' ? 'bg-divas-600 text-white shadow-sm' : 'text-gray-600 hover:text-divas-900'}`}>
                                    📊 Por Año Completo
                                </button>
                            </div>

                            {/* DATE CONTROLS */}
                            {viewMode === 'DAY' && (
                                <div className="flex items-center space-x-2">
                                    <input 
                                        type="date" 
                                        value={selectedDate} 
                                        onChange={e => setSelectedDate(e.target.value)}
                                        className="p-2 border border-gray-200 rounded-xl text-xs font-bold text-divas-900 focus:outline-none focus:ring-2 focus:ring-divas-500"
                                    />
                                    <button 
                                        onClick={() => setSelectedDate(TODAY_STR)}
                                        className="px-3 py-2 bg-divas-100 text-divas-800 rounded-xl text-xs font-bold hover:bg-divas-200">
                                        Hoy
                                    </button>
                                </div>
                            )}

                            {viewMode === 'MONTH' && (
                                <div className="flex items-center space-x-2">
                                    <input 
                                        type="month" 
                                        value={selectedMonth} 
                                        onChange={e => setSelectedMonth(e.target.value)}
                                        className="p-2 border border-gray-200 rounded-xl text-xs font-bold text-divas-900 focus:outline-none focus:ring-2 focus:ring-divas-500"
                                    />
                                </div>
                            )}

                            {viewMode === 'YEAR' && (
                                <div className="flex items-center space-x-2">
                                    <select 
                                        value={selectedYear} 
                                        onChange={e => setSelectedYear(e.target.value)}
                                        className="p-2 border border-gray-200 rounded-xl text-xs font-bold text-divas-900 focus:outline-none focus:ring-2 focus:ring-divas-500">
                                        <option value="2026">Año 2026</option>
                                        <option value="2025">Año 2025</option>
                                        <option value="2027">Año 2027</option>
                                    </select>
                                </div>
                            )}
                        </div>

                        {/* PROFESSIONAL FILTER */}
                        {!isProfesional ? (
                            <div>
                                <label className="block text-[10px] font-bold text-gray-400 uppercase mb-1">Filtrar por Profesional</label>
                                <select 
                                    value={selectedProfFilter}
                                    onChange={e => setSelectedProfFilter(e.target.value)}
                                    className="p-2 bg-gray-50 border border-gray-200 rounded-xl text-xs font-semibold text-gray-700">
                                    <option value="ALL">👩‍⚕️ Todos los Profesionales</option>
                                    {(users || []).filter(u => u.role === 'PROFESIONAL' || u.role === 'ADMIN').map(u => (
                                        <option key={u.id} value={u.id}>{u.name} ({u.specialty})</option>
                                    ))}
                                </select>
                            </div>
                        ) : (
                            <div className="p-2.5 bg-pink-50 border border-pink-200 rounded-xl text-xs font-bold text-divas-900 flex items-center space-x-2">
                                <i className="fa-solid fa-user-lock text-divas-600"></i>
                                <span>Mostrando exclusivamente tus reservaciones: <strong>{currentUser?.name}</strong></span>
                            </div>
                        )}
                    </div>

                    {/* APPOINTMENT LIST DISPLAY FOR MONTH / YEAR OR HOURLY SLOT FOR DAY */}
                    {viewMode !== 'DAY' ? (
                        <div className="space-y-4">
                            <h4 className="text-xs font-bold uppercase text-gray-500">
                                Listado de Reservaciones ({filteredApts.length} en total para {viewMode === 'MONTH' ? `Mes ${selectedMonth}` : `Año ${selectedYear}`})
                            </h4>

                            {filteredApts.length === 0 ? (
                                <div className="text-center py-12 text-gray-400 bg-gray-50 rounded-2xl border border-dashed border-gray-200">
                                    <i className="fa-regular fa-calendar-xmark text-4xl mb-2"></i>
                                    <p className="text-sm font-semibold">No tienes reservaciones registradas para este periodo.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {filteredApts.map(apt => (
                                        <div 
                                            key={apt.id} 
                                            onClick={() => onOpenAppointment(apt)}
                                            className="p-4 bg-divas-50/40 border border-divas-200 rounded-2xl shadow-sm hover:shadow-md transition-all cursor-pointer space-y-2">
                                            <div className="flex items-center justify-between border-b border-divas-100 pb-2">
                                                <span className="font-bold text-xs text-divas-900">🗓️ {apt.date} — {apt.startTime} a {apt.endTime}</span>
                                                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold uppercase ${
                                                    apt.status === 'CONFIRMED' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'
                                                }`}>
                                                    {apt.status}
                                                </span>
                                            </div>
                                            <div>
                                                <h5 className="font-bold text-sm text-gray-800">{apt.clientName}</h5>
                                                <p className="text-xs text-gray-500"><i className="fa-solid fa-phone text-[10px] mr-1"></i>{apt.clientPhone}</p>
                                            </div>
                                            <div className="text-xs text-gray-700 bg-white p-2.5 rounded-xl border border-gray-100 space-y-1">
                                                {(apt.services || []).filter(s => !isProfesional || s.professionalId === currentUser.id).map((s, idx) => (
                                                    <div key={idx} className="flex justify-between items-center font-medium">
                                                        <span>• {s.serviceName} ({s.variantName})</span>
                                                        <span className="text-[10px] text-divas-700 font-bold">{s.duration} min</span>
                                                    </div>
                                                ))}
                                            </div>
                                            {apt.notes && (
                                                <p className="text-[11px] text-divas-800 italic bg-amber-50 p-2 rounded-lg border border-amber-100">
                                                    📌 {apt.notes}
                                                </p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : (
                        /* HOURLY SLOT VIEW FOR DAY */
                        <div className="space-y-3">
                            {timeSlots.map(slot => {
                                const slotApts = filteredApts.filter(a => a.startTime && a.startTime.startsWith(slot.substring(0, 2)));

                                return (
                                    <div key={slot} className="flex items-start space-x-4 min-h-[70px] border-b border-gray-50 pb-3">
                                        <div className="w-16 text-xs font-bold text-divas-700 pt-1 flex-shrink-0">
                                            {slot}
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            {slotApts.length === 0 ? (
                                                <button 
                                                    onClick={() => canOperate && onNewAppointmentWithTime(selectedDate, slot)}
                                                    className={`w-full h-full border border-dashed border-gray-200 rounded-xl p-2 text-left text-xs text-gray-400 transition-all flex items-center space-x-2 ${
                                                        canOperate ? 'hover:border-divas-300 hover:text-divas-600 cursor-pointer' : 'cursor-default opacity-60'
                                                    }`}>
                                                    <i className="fa-solid fa-clock text-[10px]"></i>
                                                    <span>{canOperate ? 'Disponible — Hacer Clic para Agendar' : 'Horario Libre'}</span>
                                                </button>
                                            ) : (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                    {slotApts.map(apt => (
                                                        <div 
                                                            key={apt.id} 
                                                            onClick={() => onOpenAppointment(apt)}
                                                            className="p-3 bg-divas-50/60 border border-divas-200 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer">
                                                            <div className="flex items-center justify-between">
                                                                <span className="font-bold text-xs text-divas-900">{apt.clientName}</span>
                                                                {!isProfesional && (
                                                                    <span className="text-[10px] font-extrabold text-divas-700">${(apt.finalTotal || 0).toLocaleString('es-CL')}</span>
                                                                )}
                                                            </div>
                                                            <p className="text-[11px] text-gray-600 mt-1">
                                                                <i className="fa-solid fa-clock text-[10px] mr-1 text-divas-500"></i>
                                                                {apt.startTime} - {apt.endTime}
                                                            </p>
                                                            <div className="mt-2 text-[10px] text-gray-500 space-y-0.5">
                                                                {(apt.services || []).filter(s => !isProfesional || s.professionalId === currentUser.id).map((s, idx) => (
                                                                    <div key={idx} className="flex items-center justify-between">
                                                                        <span>• {s.serviceName}</span>
                                                                        <span className="font-semibold text-divas-800">{s.professionalName}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        function AppointmentCartModal({ isOpen, onClose, appointment, clients, catalog, users, appointments, currentUser, notify, onSaveAppointment }) {
            const isEditing = !!appointment && !!appointment.id;

            const [selectedClientId, setSelectedClientId] = useState(appointment?.clientId || (clients[0]?.id || ''));
            const [date, setDate] = useState(appointment?.date || TODAY_STR);
            const [startTime, setStartTime] = useState(appointment?.startTime || '15:00');
            const [status, setStatus] = useState(appointment?.status || 'CONFIRMED');
            const [notes, setNotes] = useState(appointment?.notes || '');
            
            const [cartServices, setCartServices] = useState(appointment?.services || []);
            
            const [discountType, setDiscountType] = useState(appointment?.discountType || 'NONE');
            const [discountValue, setDiscountValue] = useState(appointment?.discountValue || 0);
            const [hasCustomPrice, setHasCustomPrice] = useState(appointment?.hasCustomPrice || false);
            const [customFinalPrice, setCustomFinalPrice] = useState(appointment?.customFinalPrice || 0);
            const [paymentStatus, setPaymentStatus] = useState(appointment?.paymentStatus || 'PENDING');
            const [paymentMethod, setPaymentMethod] = useState(appointment?.paymentMethod || 'EFECTIVO');

            const [addServiceId, setAddServiceId] = useState(catalog[0]?.id || '');
            const [addVariantId, setAddVariantId] = useState(catalog[0]?.variants[0]?.id || '');
            const [addProfId, setAddProfId] = useState((users || []).find(u => u.role === 'PROFESIONAL')?.id || users[0]?.id || '');

            const subtotal = useMemo(() => {
                return (cartServices || []).reduce((sum, s) => sum + (Number(s.appliedPrice) || 0), 0);
            }, [cartServices]);

            const totalDuration = useMemo(() => {
                return (cartServices || []).reduce((sum, s) => sum + (Number(s.duration) || 0), 0);
            }, [cartServices]);

            const endTime = useMemo(() => {
                if (!startTime) return '15:00';
                const [h, m] = startTime.split(':').map(Number);
                const totalMins = h * 60 + m + totalDuration;
                const endH = Math.floor(totalMins / 60) % 24;
                const endM = totalMins % 60;
                return `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
            }, [startTime, totalDuration]);

            const calculatedTotal = useMemo(() => {
                let disc = 0;
                if (discountType === 'FIXED') {
                    disc = Number(discountValue) || 0;
                } else if (discountType === 'PERCENTAGE') {
                    disc = Math.round(subtotal * ((Number(discountValue) || 0) / 100));
                }
                return Math.max(0, subtotal - disc);
            }, [subtotal, discountType, discountValue]);

            const finalTotal = hasCustomPrice ? Number(customFinalPrice) || 0 : calculatedTotal;

            const handleAddServiceToCart = () => {
                const sItem = (catalog || []).find(c => c.id === addServiceId);
                if (!sItem) return;
                const variant = sItem.variants?.find(v => v.id === addVariantId) || sItem.variants[0];
                const prof = (users || []).find(u => u.id === addProfId) || users[0];

                const newItem = {
                    serviceId: sItem.id,
                    serviceName: sItem.name,
                    variantId: variant?.id || 'v1',
                    variantName: variant?.name || 'Standard',
                    catalogPrice: variant ? variant.price : sItem.price,
                    appliedPrice: variant ? variant.price : sItem.price,
                    duration: variant ? variant.duration : sItem.duration,
                    professionalId: prof.id,
                    professionalName: prof.name
                };

                setCartServices([...cartServices, newItem]);
            };

            const handleRemoveService = (index) => {
                setCartServices(cartServices.filter((_, i) => i !== index));
            };

            const handleUpdateServiceField = (index, field, value) => {
                const updated = [...cartServices];
                updated[index][field] = value;
                setCartServices(updated);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (cartServices.length === 0) {
                    notify('Debes agregar al menos un servicio a la cita.', 'error');
                    return;
                }

                const clientObj = (clients || []).find(c => c.id === selectedClientId);

                const newApt = {
                    id: appointment?.id || `apt-${Date.now()}`,
                    clientId: selectedClientId,
                    clientName: clientObj ? `${clientObj.firstName} ${clientObj.lastName}` : 'Clienta Spa',
                    clientPhone: clientObj?.phone || '',
                    date,
                    startTime,
                    endTime,
                    services: cartServices,
                    subtotal,
                    discountType,
                    discountValue: Number(discountValue),
                    calculatedTotal,
                    hasCustomPrice,
                    customFinalPrice: hasCustomPrice ? Number(customFinalPrice) : null,
                    finalTotal,
                    paymentStatus,
                    paymentMethod,
                    status,
                    notes,
                    createdAt: appointment?.createdAt || new Date().toISOString(),
                    updatedAt: new Date().toISOString(),
                    createdBy: appointment?.createdBy || currentUser?.id || 'acc-1',
                    updatedBy: currentUser?.id || 'acc-1'
                };

                onSaveAppointment(newApt);
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
                    <div className="bg-white rounded-3xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-100 flex flex-col">
                        
                        <div className="p-6 bg-gradient-to-r from-divas-900 to-divas-800 text-white flex items-center justify-between sticky top-0 z-10">
                            <div>
                                <h3 className="text-xl font-bold font-serif-title flex items-center space-x-2">
                                    <i className="fa-solid fa-cart-shopping text-divas-400"></i>
                                    <span>{isEditing ? `Editar Cita (#${appointment.id})` : 'Nueva Cita — Carrito de Servicios'}</span>
                                </h3>
                                <p className="text-xs text-divas-300 mt-0.5">Gestión integral multi-servicio, profesionales y precios de venta</p>
                            </div>
                            <button onClick={onClose} className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white">
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSave} className="p-6 space-y-6 flex-1">
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Clienta</label>
                                    <select 
                                        value={selectedClientId} 
                                        onChange={e => setSelectedClientId(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500">
                                        {(clients || []).map(c => (
                                            <option key={c.id} value={c.id}>
                                                {c.firstName} {c.lastName} ({c.rut})
                                            </option>
                                        ))}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Fecha de Reserva</label>
                                    <input 
                                        type="date" 
                                        value={date} 
                                        onChange={e => setDate(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-gray-600 mb-1">Hora Inicio</label>
                                    <input 
                                        type="time" 
                                        value={startTime} 
                                        onChange={e => setStartTime(e.target.value)}
                                        className="w-full p-2.5 bg-white border border-gray-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-divas-500"
                                    />
                                </div>
                            </div>

                            <div className="border border-divas-200 rounded-2xl p-4 bg-divas-50/40 space-y-3">
                                <h4 className="text-xs font-bold uppercase tracking-wider text-divas-800 flex items-center space-x-2">
                                    <i className="fa-solid fa-plus-circle text-divas-600"></i>
                                    <span>Agregar Servicio al Carrito</span>
                                </h4>

                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                    <div className="sm:col-span-1">
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Servicio</label>
                                        <select 
                                            value={addServiceId}
                                            onChange={e => {
                                                setAddServiceId(e.target.value);
                                                const found = (catalog || []).find(c => c.id === e.target.value);
                                                if (found && found.variants?.length) setAddVariantId(found.variants[0].id);
                                            }}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(catalog || []).map(c => (
                                                <option key={c.id} value={c.id}>{c.name} (${c.price.toLocaleString('es-CL')})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Variante</label>
                                        <select 
                                            value={addVariantId}
                                            onChange={e => setAddVariantId(e.target.value)}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(catalog || []).find(c => c.id === addServiceId)?.variants?.map(v => (
                                                <option key={v.id} value={v.id}>{v.name} (${v.price.toLocaleString('es-CL')})</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-bold text-gray-500 uppercase">Profesional</label>
                                        <select 
                                            value={addProfId}
                                            onChange={e => setAddProfId(e.target.value)}
                                            className="w-full p-2 bg-white border border-gray-200 rounded-xl text-xs">
                                            {(users || []).filter(u => u.role === 'PROFESIONAL' || u.role === 'ADMIN').map(u => (
                                                <option key={u.id} value={u.id}>{u.name}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex items-end">
                                        <button 
                                            type="button"
                                            onClick={handleAddServiceToCart}
                                            className="w-full py-2 bg-divas-600 hover:bg-divas-700 text-white rounded-xl text-xs font-bold shadow-md shadow-divas-600/20">
                                            + AGREGAR
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h4 className="text-xs font-bold uppercase tracking-wider text-gray-600 mb-2 flex items-center justify-between">
                                    <span>Servicios Agregados ({(cartServices || []).length})</span>
                                    <span className="text-divas-600 font-extrabold">Duración Estimada: {totalDuration} min ({startTime} ➔ {endTime})</span>
                                </h4>

                                {!cartServices || cartServices.length === 0 ? (
                                    <div className="p-8 text-center text-gray-400 border border-dashed border-gray-200 rounded-2xl text-xs">
                                        El carrito está vacío. Agrega al menos un servicio arriba.
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {cartServices.map((s, idx) => (
                                            <div key={idx} className="p-4 bg-white border border-gray-200 rounded-2xl shadow-sm space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <div>
                                                        <h5 className="font-bold text-xs text-divas-900">{s.serviceName}</h5>
                                                        <span className="text-[10px] text-gray-500 font-medium">Variante: {s.variantName} | Catálogo: ${(s.catalogPrice || 0).toLocaleString('es-CL')}</span>
                                                    </div>
                                                    <button 
                                                        type="button" 
                                                        onClick={() => handleRemoveService(idx)}
                                                        className="text-red-500 hover:text-red-700 text-xs font-bold px-2 py-1 rounded-lg hover:bg-red-50">
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-gray-100">
                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Profesional</label>
                                                        <select 
                                                            value={s.professionalId}
                                                            onChange={e => {
                                                                const p = (users || []).find(u => u.id === e.target.value);
                                                                if (p) {
                                                                    handleUpdateServiceField(idx, 'professionalId', p.id);
                                                                    handleUpdateServiceField(idx, 'professionalName', p.name);
                                                                }
                                                            }}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-semibold">
                                                            {(users || []).filter(u => u.role === 'PROFESIONAL' || u.role === 'ADMIN').map(u => (
                                                                <option key={u.id} value={u.id}>{u.name}</option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Precio Aplicado ($)</label>
                                                        <input 
                                                            type="number" 
                                                            value={s.appliedPrice}
                                                            onChange={e => handleUpdateServiceField(idx, 'appliedPrice', Number(e.target.value))}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-bold text-divas-900"
                                                        />
                                                    </div>

                                                    <div>
                                                        <label className="block text-[10px] font-bold text-gray-400">Duración (min)</label>
                                                        <input 
                                                            type="number" 
                                                            value={s.duration}
                                                            onChange={e => handleUpdateServiceField(idx, 'duration', Number(e.target.value))}
                                                            className="w-full p-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs font-semibold"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="bg-divas-900 text-white p-5 rounded-2xl space-y-4">
                                <h4 className="text-xs font-bold uppercase tracking-wider text-divas-300">Resumen Financiero & Descuentos</h4>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-xs">
                                    <div>
                                        <label className="block text-divas-300 mb-1 font-semibold">Tipo Descuento</label>
                                        <select 
                                            value={discountType} 
                                            onChange={e => setDiscountType(e.target.value)}

                const breakdown = { EFECTIVO: 0, DEBIT: 0, CREDIT: 0, TRANSFER: 0 };
